[package]
name = "quadtree"
version = "0.5.0"
edition = "2024"
description = "A generic quadtree implementation"
license = "MIT"
repository = "https://github.com/benbaarber/quadtree"
keywords = ["quadtree", "barnes-hut"]

[features]
default = ["std"]

serde = ["dep:serde", "glam/serde"]
std = ["glam/std"]
libm = ["glam/libm"]

[dependencies]
glam = { version = "0.30.4", default-features = false, features = ["nostd-libm"] }
serde = { version = "1.0.219", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
